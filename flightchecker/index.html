<html lang="nl">
<head>

  <title>Ticket Checker · Alpaica</title>
  <meta name="description" content="Volg automatisch de beste vluchtprijzen met de Alpaica Ticket Checker.">
  <style>
    :root{--ink:#18181b;--paper:#f4f0e7;--card:#fffdf8;--coral:#ff6a4d;--violet:#7f61ee;--mint:#52d6a3;--yellow:#ffd95a;--line:#d8d1c6;--muted:#69645e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.top{min-height:76px;padding:13px 5vw;display:flex;align-items:center;gap:34px;border-bottom:1px solid var(--line);background:rgba(244,240,231,.95);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.brand{display:flex;gap:10px;align-items:center;border:0;background:transparent;font:800 11px/1 monospace;letter-spacing:.09em;text-align:left}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--coral);font-size:19px}.nav{display:flex;gap:7px}.nav button{padding:9px 13px;border:0;border-radius:99px;background:transparent;font-size:12px;font-weight:750}.nav button.active{background:var(--ink);color:white}.nav b{display:inline-grid;place-items:center;min-width:19px;height:19px;margin-left:5px;border-radius:50%;background:var(--mint);color:var(--ink);font:700 9px monospace}.avatar{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:white;font:700 10px monospace}.eyebrow{margin:0 0 12px;font:700 10px monospace;letter-spacing:.16em}.overview{min-height:calc(100vh - 76px);display:grid;grid-template-columns:.85fr 1.15fr}.intro{padding:85px 7vw;border-right:1px solid var(--line)}h1{margin:0;font-size:clamp(54px,7vw,96px);line-height:.84;letter-spacing:-.07em}.intro h1 em{color:var(--violet);font-family:Georgia,serif;font-weight:400}.intro>p:not(.eyebrow){max-width:480px;color:var(--muted);font-size:17px;line-height:1.6}.primary{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--coral);font-weight:850;box-shadow:4px 4px 0 var(--ink)}.intro .primary{max-width:330px;margin-top:28px}.collection{padding:65px 5vw;background:#eae5db}.collection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.collection-head h2{margin:0;font-size:30px}.count{padding:7px 10px;border:1px solid var(--ink);border-radius:99px;background:var(--mint);font:700 9px monospace}.check-card{margin-bottom:13px;padding:20px;border:1px solid var(--ink);border-top:7px solid var(--coral);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--ink)}.check-card:nth-child(3n){border-top-color:var(--violet)}.check-card:nth-child(3n+1){border-top-color:var(--mint)}.card-top,.card-bottom{display:flex;align-items:center;justify-content:space-between}.check-card code{padding:5px 8px;border-radius:6px;background:var(--ink);color:white;font:700 10px monospace;letter-spacing:.1em}.live{font:700 9px monospace}.live:before{content:"";display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--mint)}.check-card h3{margin:17px 0 4px;font-size:24px;letter-spacing:-.04em}.check-card h3 span{color:var(--coral)}.check-card p{margin:0 0 20px;color:var(--muted);font-size:12px}.card-bottom{padding-top:13px;border-top:1px solid var(--line);font:10px monospace}.card-bottom button{border:0;background:transparent;text-decoration:underline;font-size:11px}.card-bottom .open{margin-left:8px;padding:8px 11px;border:1px solid var(--ink);border-radius:7px;background:var(--yellow);text-decoration:none;font-weight:800}.empty{padding:65px 25px;text-align:center;border:1px dashed #a9a199;border-radius:16px}.empty b{display:block;font-size:20px}.empty p{color:var(--muted)}.empty button{padding:11px 15px;border:1px solid var(--ink);border-radius:9px;background:var(--yellow);font-weight:800}.hero{padding:58px 8vw;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center}.hero h1{font-size:clamp(52px,7vw,88px)}.hero h1 em{color:var(--coral);font-family:Georgia,serif;font-weight:400}.hero .lead{max-width:620px;color:var(--muted);font-size:17px;line-height:1.5}.radar{width:240px;aspect-ratio:1;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,transparent 0 38px,#d3ccc1 39px 40px);font-size:34px}.share{display:flex;gap:8px;margin-top:18px}.share code{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:white;font:10px monospace}.share button{padding:9px 12px;border:1px solid var(--ink);border-radius:8px;background:var(--yellow);font-size:11px;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(350px,.75fr)}.form{padding:65px 7vw;border-right:1px solid var(--line)}.section-title{display:flex;gap:18px;margin-bottom:23px}.step{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:white;font:700 10px monospace}.section-title h2{margin:0;font-size:29px;letter-spacing:-.04em}.section-title p{margin:4px 0 0;color:var(--muted)}.route,.dates,.times,.updates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field,.date-box,.time-box,.update{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}label span,.label{display:block;margin-bottom:6px;color:#77706a;text-transform:uppercase;font:700 8px monospace;letter-spacing:.11em}.field input,.date-box input,.update input,.field select{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:6px 0;outline:none;font-weight:700}.options{display:flex;gap:9px;margin-top:13px;align-items:center}.chip{padding:9px 13px;border:1px solid var(--line);border-radius:99px;background:transparent;font-size:12px;font-weight:750}.chip.active{background:var(--violet);color:white;border-color:var(--ink)}.options .field{margin-left:auto;padding:6px 11px;min-width:130px}.divider{height:1px;background:var(--line);margin:52px 0}.time-box{margin-top:12px;background:var(--ink);color:white}.time-head{display:flex;justify-content:space-between}.time-head span{color:var(--yellow);font:700 13px monospace}.time-box.return .time-head span{color:#bba9ff}.ranges{position:relative;height:40px}.ranges:before{content:"";position:absolute;left:0;right:0;top:18px;height:5px;border-radius:5px;background:#49494d}.ranges input{position:absolute;top:8px;left:0;width:100%;pointer-events:none;appearance:none;background:transparent}.ranges input::-webkit-slider-thumb{width:21px;height:21px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1px white;appearance:none;pointer-events:auto}.return .ranges input::-webkit-slider-thumb{background:var(--violet)}.ticks{display:flex;justify-content:space-between;color:#aaa;font:9px monospace}.traveller{display:flex;align-items:center;justify-content:space-between;min-height:70px;border-bottom:1px solid var(--line)}.traveller small{display:block;color:var(--muted)}.counter{display:flex;align-items:center;gap:11px}.counter button,.age button{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;background:white}.add{padding:8px 12px;border:1px solid var(--ink);border-radius:99px;background:var(--yellow);font-size:11px;font-weight:800}.ages{display:grid;gap:7px;margin-top:8px}.age{display:flex;justify-content:flex-end;align-items:center;gap:9px}.age select{padding:7px;border:1px solid var(--line);border-radius:7px;background:white}.update{position:relative}.update button{position:absolute;right:9px;top:23px;border:0;background:transparent}.form-foot{margin-top:32px}.form-foot small{display:block;margin-top:10px;text-align:center;color:var(--muted);font:9px/1.5 monospace}.side{padding:48px 3vw;background:#eae5db}.sticky{position:sticky;top:105px}.side-head{display:flex;justify-content:space-between;align-items:center}.side-head h2{margin:0;font-size:29px}.pause{border:0;background:transparent;text-decoration:underline}.summary{margin:18px 0 10px;padding:14px;display:flex;gap:10px;align-items:center;border-radius:11px;background:var(--ink);color:white}.summary b,.summary small{display:block}.summary small{color:#aaa}.summary i{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--mint)}.check-now{width:100%;padding:11px;border:1px solid var(--ink);border-radius:9px;background:var(--card);font-weight:800}.check-now:disabled{opacity:.5}.source{text-align:center;color:var(--muted);font:8px monospace}.calendar{margin:17px 0;padding:15px;border:1px solid var(--ink);border-radius:13px;background:var(--card)}.cal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}.cal-head h3{margin:0;text-transform:capitalize}.legend{display:flex;gap:6px;font:7px monospace}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px}.low{background:#bcebd8!important}.mid{background:#ffd48a!important}.high{background:#ffada0!important}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week span{text-align:center;color:#888;font:7px monospace}.grid>i,.day{min-height:34px}.day{padding:4px;border:1px solid #e5dfd5;border-radius:5px;background:#f7f3ec;display:flex;flex-direction:column;justify-content:space-between;font:7px monospace}.day b{text-align:right;font-size:9px}.feed{display:grid;gap:10px}.feed article{padding:16px;border:1px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink)}.feed time{font:8px monospace;color:var(--muted)}.feed h3{margin:11px 0 3px;font-size:15px}.feed p{margin:0;color:var(--muted);font-size:11px}.offers{display:grid;gap:7px;margin-top:11px}.offer{display:flex;justify-content:space-between;gap:8px;padding-top:7px;border-top:1px solid var(--line);font-size:10px}.offer strong{font-size:16px}.toast{position:fixed;z-index:20;right:25px;bottom:25px;max-width:420px;padding:14px 17px;border-radius:10px;background:var(--ink);color:white;box-shadow:4px 4px 0 var(--coral);font-size:12px}.hidden{display:none!important}footer{padding:22px 5vw;display:flex;justify-content:space-between;color:var(--muted);font:9px monospace}
    @media(max-width:900px){.overview,.layout{grid-template-columns:1fr}.intro,.form{border-right:0}.hero{grid-template-columns:1fr}.radar{display:none}.sticky{position:static}}@media(max-width:600px){.top{flex-wrap:wrap}.nav{order:3;width:100%}.nav button{flex:1}.intro,.collection,.hero,.form,.side{padding:42px 20px}.intro h1,.hero h1{font-size:53px}.route,.dates,.times,.updates{grid-template-columns:1fr}.options{flex-wrap:wrap}.options .field{width:100%;margin-left:0}.share{flex-direction:column}.share code{overflow:hidden;text-overflow:ellipsis}.card-bottom{align-items:flex-start;gap:10px;flex-direction:column}footer{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <header class="top"><button class="brand" id="home"><span class="mark">✦</span><span>ALPAICA<br>TICKET CHECKER</span></button><nav class="nav"><button id="overviewNav" class="active">Actieve checks <b id="count">0</b></button><button id="newNav">+ Nieuwe checker</button></nav><button class="avatar">JP</button></header>
  <main id="app"></main><div id="toast" class="toast hidden"></div><footer><span>Ticket Checker · Alpaica</span><span>Vluchtprijzen via SerpApi Google Flights</span></footer>
  <script>
    const $=s=>document.querySelector(s), api="/api/ticket-checkers"; let checkers=[],current=null,view="overview";
    const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    const fresh=()=>({id:"",origin:"Zürich (ZRH)",destination:"Lissabon (LIS)",direct:false,maxStops:1,departStart:iso(23),departEnd:iso(27),returnStart:iso(30),returnEnd:iso(35),departFrom:7,departTo:18,returnFrom:9,returnTo:21,adults:2,childAges:[8],updateTimes:["08:00","18:00"],active:true,history:[],feed:[]});
    const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function toast(message){const t=$("#toast");t.textContent=message;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3500)}
    async function request(url,options){const r=await fetch(url,options),data=await r.json();if(!r.ok)throw new Error(data.error||"Er ging iets mis.");return data}
    async function load(){try{checkers=(await request(api)).checkers||[]}catch{checkers=[]}const id=new URLSearchParams(location.search).get("checker");if(id){try{current=(await request(`${api}/${encodeURIComponent(id)}`)).checker;view="editor"}catch{toast("Checker niet gevonden.")}}render()}
    function syncNav(){$("#overviewNav").classList.toggle("active",view==="overview");$("#count").textContent=checkers.length}
    function render(){syncNav();view==="overview"?renderOverview():renderEditor()}
    function renderOverview(){document.title="Actieve Ticket Checkers · Alpaica";$("#app").innerHTML=`<section class="overview"><div class="intro"><p class="eyebrow">ALPAICA FLIGHTCHECKER</p><h1>Al je actieve<br><em>prijsradars.</em></h1><p>Elke reis heeft een eigen korte code en directe link. Open een checker om instellingen, prijsfeed en historie te bekijken.</p><button class="primary" data-new>Nieuwe checker <span>→</span></button></div><div class="collection"><div class="collection-head"><h2>Actieve checks</h2><span class="count">${checkers.length} actief</span></div>${checkers.length?checkers.map((c,i)=>`<article class="check-card"><div class="card-top"><code>${c.id}</code><span class="live">Actief</span></div><h3>${escape(c.origin.split(" (")[0])} <span>→</span> ${escape(c.destination.split(" (")[0])}</h3><p>${c.departStart} – ${c.returnEnd} · ${c.adults+(c.childAges||[]).length} reizigers</p><div class="card-bottom"><span>${(c.updateTimes||[]).join(" · ")}</span><div><button data-pause="${c.id}">Pauzeer</button><button class="open" data-open="${c.id}">Open →</button></div></div></article>`).join(""):`<div class="empty"><b>Nog geen actieve checkers</b><p>Zet je eerste reisradar aan en hij verschijnt hier met een eigen ID.</p><button data-new>Eerste checker maken</button></div>`}</div></section>`}
    function section(n,title,sub){return `<div class="section-title"><span class="step">${n}</span><div><h2>${title}</h2><p>${sub}</p></div></div>`}
    function field(label,key,type="text"){return `<label class="field"><span>${label}</span><input type="${type}" data-key="${key}" value="${escape(current[key])}"></label>`}
    function timeBox(title,prefix,cls=""){return `<div class="time-box ${cls}"><div class="time-head"><b>${title}</b><span id="${prefix}Label">${pad(current[prefix+"From"])}:00 – ${pad(current[prefix+"To"])}:00</span></div><div class="ranges"><input type="range" min="0" max="23" value="${current[prefix+"From"]}" data-range="${prefix}From"><input type="range" min="1" max="24" value="${current[prefix+"To"]}" data-range="${prefix}To"></div><div class="ticks"><span>00:00</span><span>12:00</span><span>24:00</span></div></div>`}
    const pad=n=>String(n).padStart(2,"0");
    function renderEditor(){current=current||fresh();document.title=`${current.id||"Nieuwe"} Ticket Checker · Alpaica`;const route=`${escape(current.origin.split(" (")[0])} → ${escape(current.destination.split(" (")[0])}`;$("#app").innerHTML=`<section class="hero"><div><p class="eyebrow">${current.id?`CHECKER ${current.id}`:"NIEUWE CHECKER"}</p><h1>Jouw tickets.<br><em>Onze radar.</em></h1><p class="lead">Stel je reis in en volg automatisch de drie beste vluchtprijzen.</p>${current.id?`<div class="share"><code>alpaica.com/flightchecker/?checker=${current.id}</code><button id="copy">Kopieer link</button></div>`:""}</div><div class="radar">✈</div></section><div class="layout"><form class="form" id="form">${section("01","Waar wil je heen?","Stel je route en voorkeuren in.")}<div class="route">${field("Van","origin")}${field("Naar","destination")}</div><div class="options"><button type="button" class="chip ${!current.direct?"active":""}" data-direct="false">↗ Retour</button><button type="button" class="chip ${current.direct?"active":""}" data-direct="true">→ Alleen direct</button><label class="field"><span>Max. stops</span><select data-key="maxStops"><option value="0">Direct</option><option value="1">1 stop</option><option value="2">2 stops</option></select></label></div><div class="divider"></div>${section("02","Wanneer kun je?","Hoe ruimer je bent, hoe beter de deal.")}<div class="dates">${field("Vertrek vanaf","departStart","date")}${field("Vertrek t/m","departEnd","date")}${field("Terug vanaf","returnStart","date")}${field("Terug t/m","returnEnd","date")}</div>${timeBox("Gewenste vertrektijd heen","depart")}${timeBox("Gewenste vertrektijd terug","return","return")}<div class="divider"></div>${section("03","Wie reizen er?","De totaalprijs geldt voor het hele gezelschap.")}<div class="traveller"><div><b>Volwassenen</b><small>12 jaar en ouder</small></div><div class="counter"><button type="button" data-count="-1">−</button><b id="adults">${current.adults}</b><button type="button" data-count="1">+</button></div></div><div class="traveller"><div><b>Kinderen</b><small>Leeftijd op vertrekdag</small></div><button type="button" class="add" id="addChild">+ Kind toevoegen</button></div><div class="ages" id="ages"></div><div class="divider"></div>${section("04","Wanneer wil je updates?","Maximaal vier vaste momenten per dag.")}<div class="updates" id="updates"></div><div class="form-foot"><button class="primary" type="submit">${current.id?"Checker bijwerken":"Checker aanzetten"}<span>→</span></button><small>Dagelijks · ${current.adults+(current.childAges||[]).length} reizigers · ${current.direct?"direct":`max. ${current.maxStops} stop`}</small></div></form><aside class="side"><div class="sticky"><div class="side-head"><div><p class="eyebrow">JOUW PRIJSFEED</p><h2>De radar</h2></div>${current.id?`<button class="pause" id="pause">${current.active?"Pauzeren":"Aanzetten"}</button>`:""}</div><div class="summary"><span>✈</span><div><b>${route}</b><small>${current.departStart} t/m ${current.departEnd}</small></div><i></i></div><button class="check-now" id="checkNow" ${!current.id||!current.active?"disabled":""}>Nu prijzen controleren ↻</button><p class="source">Automatische updates via SerpApi Google Flights</p><div id="calendar"></div><div class="feed" id="feed"></div></div></aside></div>`;document.querySelector('[data-key="maxStops"]').value=current.maxStops;renderAges();renderUpdates();renderCalendar();renderFeed()}
    function renderAges(){$("#ages").innerHTML=(current.childAges||[]).map((age,i)=>`<div class="age"><label>Kind ${i+1} <select data-age="${i}">${Array.from({length:18},(_,n)=>`<option value="${n}" ${n==age?"selected":""}>${n} jaar</option>`).join("")}</select></label><button type="button" data-remove-child="${i}">×</button></div>`).join("")}
    function renderUpdates(){$("#updates").innerHTML=(current.updateTimes||[]).map((t,i)=>`<label class="update"><span>Update ${i+1}</span><input type="time" value="${t}" data-time="${i}"><button type="button" data-remove-time="${i}">×</button></label>`).join("")+((current.updateTimes||[]).length<4?`<button type="button" class="add" id="addTime">+ Tijdstip toevoegen</button>`:"")}
    function renderCalendar(){const history=current.history||[],now=new Date(),year=now.getFullYear(),month=now.getMonth(),days=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7,mh=history.filter(h=>{const d=new Date(h.date+"T12:00:00");return d.getFullYear()==year&&d.getMonth()==month}),sorted=mh.map(h=>h.price).sort((a,b)=>a-b),low=sorted[Math.max(0,Math.ceil(sorted.length*.33)-1)]||0,high=sorted[Math.max(0,Math.ceil(sorted.length*.67)-1)]||0,map=new Map(mh.map(h=>[+h.date.slice(-2),h.price])),name=now.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});$("#calendar").innerHTML=`<section class="calendar"><div class="cal-head"><div><p class="eyebrow">PRIJSHISTORIE</p><h3>${name}</h3></div><div class="legend"><span><i class="low"></i> laag</span><span><i class="mid"></i> midden</span><span><i class="high"></i> hoog</span></div></div><div class="week">${["ma","di","wo","do","vr","za","zo"].map(d=>`<span>${d}</span>`).join("")}</div><div class="grid">${"<i></i>".repeat(offset)}${Array.from({length:days},(_,i)=>{const day=i+1,p=map.get(day),cls=p==null?"":p<=low?"low":p<=high?"mid":"high";return `<div class="day ${cls}"><span>${day}</span>${p?`<b>€${p}</b>`:""}</div>`}).join("")}</div></section>`}
    function renderFeed(){const feed=current.feed||[];$("#feed").innerHTML=feed.length?feed.map(item=>`<article><time>${new Date(item.checkedAt).toLocaleString("nl-NL")}</time><h3>Laagste prijs €${item.lowestPrice}</h3><p>De drie beste opties van deze controle.</p><div class="offers">${(item.offers||[]).map(o=>`<div class="offer"><span>${escape(o.airline||"Vlucht")} · ${o.stops||0} stop(s)</span><strong>€${o.price}</strong></div>`).join("")}</div></article>`).join(""):`<div class="empty"><b>Nog geen prijschecks</b><p>Controleer nu of wacht op het eerste ingestelde moment.</p></div>`}
    document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;if(t.matches("[data-new],#newNav")){current=fresh();view="editor";history.replaceState({},"","/flightchecker/");render()}if(t.id==="home"||t.id==="overviewNav"){view="overview";current=null;history.replaceState({},"","/flightchecker/");render()}if(t.dataset.open){current=(await request(`${api}/${t.dataset.open}`)).checker;view="editor";history.replaceState({},"",`?checker=${current.id}`);render()}if(t.dataset.pause){await request(`${api}/${t.dataset.pause}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:false})});checkers=checkers.filter(c=>c.id!==t.dataset.pause);render()}if(t.dataset.direct){current.direct=t.dataset.direct==="true";if(current.direct)current.maxStops=0;renderEditor()}if(t.dataset.count){current.adults=Math.min(9,Math.max(1,current.adults+Number(t.dataset.count)));renderEditor()}if(t.id==="addChild"&&current.childAges.length<6){current.childAges.push(7);renderAges()}if(t.dataset.removeChild!=null){current.childAges.splice(+t.dataset.removeChild,1);renderAges()}if(t.id==="addTime"){current.updateTimes.push("12:00");renderUpdates()}if(t.dataset.removeTime!=null){current.updateTimes.splice(+t.dataset.removeTime,1);renderUpdates()}if(t.id==="copy"){await navigator.clipboard.writeText(location.href);toast("Directe link gekopieerd.")}if(t.id==="pause"){current=(await request(`${api}/${current.id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:!current.active})})).checker;renderEditor()}if(t.id==="checkNow"){t.disabled=true;t.textContent="Prijzen ophalen…";try{current=(await request(`${api}/${current.id}/check`,{method:"POST"})).checker;renderEditor();toast("Prijscheck voltooid.")}catch(err){toast(err.message);t.disabled=false;t.textContent="Nu prijzen controleren ↻"}}})
    document.addEventListener("input",e=>{const t=e.target;if(t.dataset.key)current[t.dataset.key]=t.type==="number"?+t.value:t.value;if(t.dataset.range){const key=t.dataset.range,prefix=key.startsWith("depart")?"depart":"return";current[key]=+t.value;if(current[prefix+"From"]>=current[prefix+"To"]){key.endsWith("From")?current[key]=current[prefix+"To"]-1:current[key]=current[prefix+"From"]+1;t.value=current[key]}$("#"+prefix+"Label").textContent=`${pad(current[prefix+"From"])}:00 – ${pad(current[prefix+"To"])}:00`}if(t.dataset.age!=null)current.childAges[+t.dataset.age]=+t.value;if(t.dataset.time!=null)current.updateTimes[+t.dataset.time]=t.value})
    document.addEventListener("change",e=>{const t=e.target;if(t.dataset.key)current[t.dataset.key]=t.tagName==="SELECT"?+t.value:t.value})
    document.addEventListener("submit",async e=>{if(e.target.id!=="form")return;e.preventDefault();try{current=(await request(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(current)})).checker;checkers=[current,...checkers.filter(c=>c.id!==current.id&&c.active)];history.replaceState({},"",`?checker=${current.id}`);renderEditor();syncNav();toast(`Checker ${current.id} staat aan.`)}catch(err){toast(err.message)}})
    load();
  </script>
</body>
