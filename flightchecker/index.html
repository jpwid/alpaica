splay:flex;gap:10px;align-items:center;border-radius:11px;background:var(--ink);color:white}.summary b,.summary small{display:block}.summary small{color:#aaa}.summary i{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--mint)}.check-now{width:100%;padding:11px;border:1px solid var(--ink);border-radius:9px;background:var(--card);font-weight:800}.check-now:disabled{opacity:.5}.source{text-align:center;color:var(--muted);font:8px monospace}.calendar{margin:17px 0;padding:15px;border:1px solid var(--ink);border-radius:13px;background:var(--card)}.cal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}.cal-head h3{margin:0;text-transform:capitalize}.legend{display:flex;gap:6px;font:7px monospace}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px}.low{background:#bcebd8!important}.mid{background:#ffd48a!important}.high{background:#ffada0!important}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week span{text-align:center;color:#888;font:7px monospace}.grid>i,.day{min-height:34px}.day{padding:4px;border:1px solid #e5dfd5;border-radius:5px;background:#f7f3ec;display:flex;flex-direction:column;justify-content:space-between;font:7px monospace}.day b{text-align:right;font-size:9px}.feed{display:grid;gap:10px}.feed article{padding:16px;border:1px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink)}.feed time{font:8px monospace;color:var(--muted)}.feed h3{margin:11px 0 3px;font-size:15px}.feed p{margin:0;color:var(--muted);font-size:11px}.offers{display:grid;gap:7px;margin-top:11px}.offer{display:flex;justify-content:space-between;gap:8px;padding-top:7px;border-top:1px solid var(--line);font-size:10px}.offer strong{font-size:16px}.toast{position:fixed;z-index:20;right:25px;bottom:25px;max-width:420px;padding:14px 17px;border-radius:10px;background:var(--ink);color:white;box-shadow:4px 4px 0 var(--coral);font-size:12px}.hidden{display:none!impor     .airport-hint{display:block;margin-top:7px;color:var(--muted);font:9px/1.35 monospace}.api-state{display:flex;justify-content:center;align-items:center;gap:6px;margin:9px 0;color:var(--muted);font:8px monospace}.api-state i{width:7px;height:7px;border-radius:50%;background:#aaa}.api-state.connected i{background:var(--mint)}
    .offer{display:block}.offer summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none}.offer summary::-webkit-details-marker{display:none}.offer-summary{display:grid;gap:3px}.offer-summary small{color:var(--muted);font:8px monospace}.offer-price{display:flex;align-items:center;gap:8px}.offer-price:after{content:"+";width:19px;height:19px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;font-weight:800}.offer[open] .offer-price:after{content:"−"}.offer-details{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.trip{margin-top:10px}.trip:first-child{margin-top:0}.trip-head{display:flex;justify-content:space-between;margin-bottom:6px;font:800 8px monospace;text-transform:uppercase;letter-spacing:.08em}.segment{padding:9px;border-radius:8px;background:#f2ede4}.segment+.segment{margin-top:5px}.segment-top,.segment-route{display:flex;justify-content:space-between;gap:8px}.segment-top{margin-bottom:5px;font-size:9px}.segment-route{align-items:end}.segment-route b{font-size:11px}.segment-route small{color:var(--muted);font:8px monospace}.offer-empty{color:var(--muted);font-size:9px}
    .result-actions{display:flex;justify-content:flex-end;margin:10px 0}.danger,.delete-result{border:0;background:transparent;color:#a8382d;text-decoration:underline;font-size:9px}.price-breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font:8px monospace}.layover{margin:5px 0;padding:7px 9px;border-left:3px solid var(--violet);background:#eee7ff;font:8px monospace}.date-range{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;text-align:left;font-weight:750}.range-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mail-state{display:block;margin-top:7px;color:var(--muted);font:8px/1.4 monospace}.date-overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(24,24,27,.48)}.date-picker{width:min(430px,100%);padding:20px;border:2px solid var(--ink);border-radius:15px;background:var(--card);box-shadow:7px 7px 0 var(--ink)}.picker-head{display:flex;justify-content:space-between;align-items:center}.picker-head button{border:1px solid var(--ink);border-radius:7px;background:white}.picker-week,.picker-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.picker-week{margin:14px 0 6px;text-align:center;color:var(--muted);font:8px monospace}.picker-days button{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white}.picker-days button.selected{background:var(--yellow);border-color:var(--ink)}.picker-days button.between{background:#fff0b5}.picker-days button:disabled{opacity:.25}.picker-help{margin:12px 0 0;color:var(--muted);font:9px monospace}.picker-close{float:right;margin-top:12px;padding:8px 11px;border:1px solid var(--ink);border-radius:7px;background:white}.city-option{font-weight:800}
    @media(max-width:900px){.overview,.layout{grid-template-columns:1fr}.intro,.form{border-right:0}.hero{grid-template-columns:1fr}.radar{display:none}.sticky{position:static}}@media(max-width:600px){.top{flex-wrap:wrap}.nav{order:3;width:100%}.nav button{flex:1}.intro,.collection,.hero,.form,.side{padding:42px 20px}.intro h1,.hero h1{font-size:53px}.route,.dates,.times,.updates{grid-template-columns:1fr}.options{flex-wrap:wrap}.options .field{width:100%;margin-left:0}.share{flex-direction:column}.share code{overflow:hidden;text-overflow:ellipsis}.card-bottom{align-items:flex-start;gap:10px;flex-direction:column}footer{flex-direction:column;gap:8px}}

<body>
  <header class="top"><button class="brand" id="home"><span class="mark">✦</span><span>ALPAICA<br>TICKET CHECKER</span></button><nav class="nav"><button id="overviewNav" class="active">Actieve checks <b id="count">0</b></button><button id="newNav">+ Nieuwe checker</button></nav><button class="avatar">JP</button></header>
  <main id="app"></main><div id="toast" class="toast hidden"></div><footer><span>Ticket Checker · Alpaica</span><span>Vluchtprijzen via SerpApi Google Flights</span></footer>
  <script>
    const $=s=>document.querySelector(s), api="/api/ticket-checkers"; let checkers=[],current=null,view="overview",providerConnected=false,emailConnected=false,locationTimer=0,savedSearchSignature="",pickerState=null;
    const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    const addDays=(value,days)=>{const d=new Date(value+"T12:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
    const dayDiff=(from,to)=>Math.round((new Date(to+"T12:00:00")-new Date(from+"T12:00:00"))/86400000);
    const fresh=()=>({id:"",origin:"Zürich (ZRH)",destination:"Lissabon (LIS)",email:"",direct:false,maxStops:1,departStart:iso(23),departEnd:iso(27),returnStart:iso(30),returnEnd:iso(35),departFrom:7,departTo:18,returnFrom:9,returnTo:21,adults:2,childAges:[8],updateTimes:["08:00","18:00"],active:true,history:[],feed:[]});
    const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    function toast(message){const t=$("#toast");t.textContent=message;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3500)}
    async function request(url,options){const r=await fetch(url,options),data=await r.json();if(!r.ok)throw new Error(data.error||"Er ging iets mis.");return data}
    const searchSignature=checker=>JSON.stringify([checker.origin,checker.destination,checker.direct,checker.maxStops,checker.departStart,checker.departEnd,checker.returnStart,checker.returnEnd,checker.departFrom,checker.departTo,checker.returnFrom,checker.returnTo,checker.adults,checker.childAges]);
    async function load(){try{checkers=(await request(api)).checkers||[]}catch{checkers=[]}try{const status=await request("/api/status");providerConnected=Boolean((status.flightSearchProviders||[]).find(p=>p.id==="serpapi")?.configured);emailConnected=Boolean(status.emailNotifications?.configured)}catch{providerConnected=false;emailConnected=false}const id=new URLSearchParams(location.search).get("checker");if(id){try{current=(await request(`${api}/${encodeURIComponent(id)}`)).checker;savedSearchSignature=searchSignature(current);view="editor"}catch{toast("Checker niet gevonden.")}}render()}
    function syncNav(){$("#overviewNav").classList.toggle("active",view==="overview");$("#count").textContent=checkers.length}
    function render(){syncNav();view==="overview"?renderOverview():renderEditor()}
    function renderOverview(){document.title="Actieve Ticket Checkers · Alpaica";$("#app").innerHTML=`<section class="overview"><div class="intro"><p class="eyebrow">ALPAICA FLIGHTCHECKER</p><h1>Al je actieve<br><em>prijsradars.</em></h1><p>Elke reis heeft een eigen korte code en directe link. Open een checker om instellingen, prijsfeed en historie te bekijken.</p><button class="primary" data-new>Nieuwe checker <span>→</span></button></div><div class="collection"><div class="collection-head"><h2>Actieve checks</h2><span class="count">${checkers.length} actief</span></div>${checkers.length?checkers.map((c,i)=>`<article class="check-card"><div class="card-top"><code>${c.id}</code><span class="live">Actief</span></div><h3>${escape(c.origin.split(" (")[0])} <span>→</span> ${escape(c.destination.split(" (")[0])}</h3><p>${c.departStart} – ${c.returnEnd} · ${c.adults+(c.childAges||[]).length} reizigers</p><div class="card-bottom"><span>${(c.updateTimes||[]).join(" · ")}</span><div><button data-pause="${c.id}">Pauzeer</button><button class="open" data-open="${c.id}">Open →</button></div></div></article>`).join(""):`<div class="empty"><b>Nog geen actieve checkers</b><p>Zet je eerste reisradar aan en hij verschijnt hier met een eigen ID.</p><button data-new>Eerste checker maken</button></div>`}</div></section>`}
    function section(n,title,sub){return `<div class="section-title"><span class="step">${n}</span><div><h2>${title}</h2><p>${sub}</p></div></div>`}
    function field(label,key,type="text"){const mins={departStart:iso(0),departEnd:current.departStart,returnStart:addDays(current.departEnd,1),returnEnd:current.returnStart};return `<label class="field"><span>${label}</span><input type="${type}" data-key="${key}" value="${escape(current[key])}" ${type==="date"?`min="${mins[key]}"`:""}></label>`}
    function airportField(label,key){return `<label class="field"><span>${label}</span><input type="text" data-key="${key}" data-airport="${key}" list="${key}Airports" autocomplete="off" value="${escape(current[key])}" placeholder="Typ plaats, luchthaven of IATA-code"><datalist id="${key}Airports"></datalist><small class="airport-hint">Wereldwijd zoeken in Google Flights-luchthavens</small></label>`}
    function timeBox(title,prefix,cls=""){return `<div class="time-box ${cls}"><div class="time-head"><b>${title}</b><span id="${prefix}Label">${pad(current[prefix+"From"])}:00 – ${pad(current[prefix+"To"])}:00</span></div><div class="ranges"><input type="range" min="0" max="23" value="${current[prefix+"From"]}" data-range="${prefix}From"><input type="range" min="1" max="24" value="${current[prefix+"To"]}" data-range="${prefix}To"></div><div class="ticks"><span>00:00</span><span>12:00</span><span>24:00</span></div></div>`}

      if(button?.dataset.monthShift){pickerState.month=new Date(pickerState.month.getFullYear(),pickerState.month.getMonth()+Number(button.dataset.monthShift),1);renderDateOverlay();return}
      if(button?.dataset.pickDate){pickRangeDate(button.dataset.pickDate);return}
      if(button?.id==="clearResults"&&current.id){if(!confirm("Alle prijsmetingen en kalenderhistorie van deze checker verwijderen?"))return;current=(await request(`${api}/${current.id}/results`,{method:"DELETE"})).checker;renderEditor();toast("Alle oude resultaten zijn verwijderd.");return}
      if(button?.dataset.deleteResult&&current.id){if(!confirm("Deze prijsmeting verwijderen?"))return;current=(await request(`${api}/${current.id}/results/${encodeURIComponent(button.dataset.deleteResult)}`,{method:"DELETE"})).checker;renderEditor();toast("Prijsmeting verwijderd.");return}
      const close=e.target.closest("[data-close-picker]");if(close&&e.target.closest(".date-picker")===null||button?.dataset.closePicker!==undefined){pickerState=null;renderDateOverlay()}
      if(button?.matches("[data-new],#newNav")){savedSearchSignature=""}
      if(button?.dataset.open)setTimeout(()=>{if(current?.id)savedSearchSignature=searchSignature(current)},500);
    },true);
    document.addEventListener("submit",async e=>{
      if(e.target.id!=="form")return;
      e.preventDefault();e.stopImmediatePropagation();
      try{
        const changed=current.id&&savedSearchSignature&&searchSignature(current)!==savedSearchSignature;
        const resetResults=Boolean(changed&&(current.feed||[]).length&&confirm("De zoekinstellingen zijn gewijzigd. Wil je de vorige prijsresultaten en kalenderhistorie verwijderen?"));
        current=(await request(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...current,resetResults})})).checker;
        savedSearchSignature=searchSignature(current);checkers=[current,...checkers.filter(c=>c.id!==current.id&&c.active)];history.replaceState({},"",`?checker=${current.id}`);renderEditor();syncNav();toast(resetResults?`Checker ${current.id} bijgewerkt; oude resultaten verwijderd.`:`Checker ${current.id} staat aan.`)
      }catch(err){toast(err.message)}
    },true);
    load();
  </script>
</body>
</html>
