name: Deploy Alpaica to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare webroot files
        run: |
          rm -rf deploy-root
          mkdir -p deploy-root
          cp outputs/index.html deploy-root/index.html
          cp outputs/europe-cities.js deploy-root/europe-cities.js
          cp outputs/meetway-hero.png deploy-root/meetway-hero.png
          find deploy-root -maxdepth 2 -type f -print

      - name: Check Hostinger secrets
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_PROTOCOL: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          HOSTINGER_FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
        run: |
          missing=0
          for name in HOSTINGER_FTP_HOST HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD HOSTINGER_FTP_PROTOCOL HOSTINGER_FTP_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
              missing=1
            fi
          done
          if echo "$HOSTINGER_FTP_HOST" | grep -Eq '://|/'; then
            echo "::error::HOSTINGER_FTP_HOST must be only the hostname or IP address, for example ftp.alpaica.com or 123.123.123.123. Do not include ftp://, https://, public_html, or slashes."
            missing=1
          fi
          if [ "$HOSTINGER_FTP_PROTOCOL" != "ftp" ] && [ "$HOSTINGER_FTP_PROTOCOL" != "ftps" ]; then
            echo "::error::HOSTINGER_FTP_PROTOCOL must be ftp or ftps."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}
          local-dir: ./deploy-root/
          server-dir: public_html/
